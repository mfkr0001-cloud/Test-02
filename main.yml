

name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "3.9.0"
          build-config: Release
