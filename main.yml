name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android Mod
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI & SDK
        run: |
          mkdir -p ~/.geode/bin
          wget https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -O geode.zip
          unzip geode.zip -d ~/.geode/bin
          chmod +x ~/.geode/bin/geode
          echo "$HOME/.geode/bin" >> $GITHUB_PATH
          
          # Устанавливаем официальный SDK Geode
          geode sdk install

      - name: Configure CMake with Geode SDK
        run: |
          mkdir build
          cd build
          # Передаем путь к SDK напрямую в CMake, чтобы он точно нашел GeodeConfig.cmake
          cmake .. -DGeode_DIR="$HOME/.geode/sdk"

      - name: Build Mod
        run: |
          cd build
          cmake --build .
