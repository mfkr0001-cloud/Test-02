name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android Mod
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI & SDK
        run: |
          mkdir -p ~/.geode/bin
          wget https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -O geode.zip
          unzip geode.zip -d ~/.geode/bin
          chmod +x ~/.geode/bin/geode
          echo "$HOME/.geode/bin" >> $GITHUB_PATH
          
          # Устанавливаем SDK и принудительно регистрируем его
          ~/.geode/bin/geode sdk install

      - name: Build Mod for Android
        run: |
          # Экспортируем путь к Geode SDK, чтобы CMake наконец-то нашел GeodeConfig.cmake
          export Geode_DIR="$HOME/.geode/sdk"
          
          geode --version
          geode package build --target android64 --target android32
